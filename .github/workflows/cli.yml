name: CLI Tests

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "cmd/**"
      - "internal/**"
      - "migrations/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/cli.yml"
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - "cmd/**"
      - "internal/**"
      - "migrations/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/cli.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version-file: "go.mod"

      - name: Install CLI dependencies
        run: |
          cd cli
          pip install -e ".[dev]"

      - name: Run CLI checks (lint, format, typecheck, tests)
        run: make -C cli check

      - name: Build CLI distribution
        run: make -C cli build

      - name: Run CLI smoke tests
        run: make -C cli smoke
